# Production overlay — używaj razem z bazowym docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Różnice względem dev-a:
#  - Postgres NIE wystawia portu 5432 na hosta — łączymy się tylko via
#    docker network (service name `postgres`).
#  - Aplikacja zbudowana z lokalnego Dockerfile, restart=unless-stopped,
#    wystawia 8080 tylko na localhost (Caddy/nginx robi reverse proxy).
#  - Volume na pg_dump backupy.

services:
  postgres:
    # Nadpisujemy ports z dev-a — wycinamy publiczny dostęp.
    ports: !reset []
    environment:
      POSTGRES_USER: gaidu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
      POSTGRES_DB: gaidu

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaidu-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://gaidu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}@postgres:5432/gaidu
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-2592000}
      RUST_LOG: ${RUST_LOG:-info,gaidu_server=info,sqlx=warn}
    ports:
      # Tylko localhost — publiczny dostęp dajemy przez Caddy/nginx z TLS.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Worker do nocnych pg_dump-ów. Odpalany przez `docker compose run`
  # z hosta (cron na hoście) albo wywołany ręcznie.
  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ts=$$(date +%Y%m%d-%H%M%S)
        pg_dump -h postgres -U gaidu gaidu | gzip > /backups/gaidu-$$ts.sql.gz
        # Usuń kopie starsze niż 14 dni
        find /backups -name 'gaidu-*.sql.gz' -mtime +14 -delete
        echo "backup OK: gaidu-$$ts.sql.gz"
