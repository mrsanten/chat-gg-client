[package]
name = "tauri-app"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "io-util", "process", "rt-multi-thread"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
# Phase 3 PoC (E2E via MLS — RFC 9420). Trzymamy w dev-dependencies, bo
# crate jest tylko w testach (`mls::tests::*`) — nie chcemy spuchnąć
# release binarki przed wpięciem MLS-a w runtime (phase 3C+).
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
tls_codec = { version = "0.4", features = ["std", "derive"] }
