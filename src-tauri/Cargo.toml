[package]
name = "tauri-app"
version = "0.14.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# rustls 0.23 wymaga jawnej rejestracji CryptoProvidera na iOS/Androidzie,
# inaczej reqwest 0.13 (pulled przez plugin-updater i in.) panicuje
# „No provider set". Bierzemy `ring` — bardziej przenośny niż aws-lc-rs
# przy cross-compile na mobile.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "io-util", "process", "rt-multi-thread"] }
anyhow = "1"
thiserror = "2"

# Phase 3C+: MLS w runtime. Storage persystowany do plików JSON w
# app_local_data_dir.
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
openmls_memory_storage = { version = "0.5", features = ["persistence"] }
tempfile = "3"
tls_codec = { version = "0.4", features = ["std", "derive"] }
base64 = "0.22"

# Plugin-updater i plugin-process działają tylko na desktopie (Apple/Google
# nie pozwalają na self-update spoza store-ów, plugin-process::relaunch
# jest disabled na iOS).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
